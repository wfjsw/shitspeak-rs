syntax = "proto3";
package s2s_application;

// Outer envelopes for the L3 application layer. Two service tags are
// reserved on the overlay's `ServiceRegistry`:
//   tag = 2 → ModerationEnvelope (sent to a single owner node)
//   tag = 3 → VoiceFrame (broadcast / multicast / unicast per delivery mode)
//   tag = 4 → UserStatsEnvelope (request/reply RPC)
//   tag = 5 → PluginDataEnvelope (client-to-client plugin payload fanout)
//   tag = 6 → TextMessageEnvelope (client text fanout)

// ── Moderation ────────────────────────────────────────────────────────────

// Fire-and-forget moderation command shipped from the originating node
// (where the moderator's connection lives) to the owner node of the
// target client. Successful application propagates back via owner-scoped
// replication of `ClientGlobalState`; no reply is sent on this channel.
message ModerationEnvelope {
  uint32 actor_session  = 1;   // composite ClientSessionIdentifier
  uint32 target_session = 2;   // composite ClientSessionIdentifier
  uint64 issued_at_ms   = 3;   // wall-clock at originator; tracing only
  string server_id      = 6;   // empty/absent means "default" for legacy peers
  oneof command {
    UserStatePatch  user_state  = 4;
    UserRemovePatch user_remove = 5;
  }
}

// Subset of UserState fields that represent a moderator-driven mutation
// of a remote client's state. Fields are optional; only present fields
// are applied. Self-only fields (self_mute, recording, plugin_*, etc.)
// are intentionally absent — those never need cross-node routing.
message UserStatePatch {
  optional uint32 channel_id           = 1;
  optional bool   mute                 = 2;
  optional bool   deaf                 = 3;
  optional bool   suppress             = 4;
  optional bool   priority_speaker     = 5;
  repeated uint32 listening_channel_add    = 6;
  repeated uint32 listening_channel_remove = 7;
  // Sanity check: originator's view of the target's current channel at
  // the time of dispatch. Owner drops the command if its current view
  // disagrees (stale moderator UI raced with a self-move).
  optional uint32 expected_from_channel = 8;
}

message UserRemovePatch {
  optional string reason = 1;
  bool   ban             = 2;
  optional bool ban_certificate = 3;
  optional bool ban_ip          = 4;
}

// ── UserStats RPC ─────────────────────────────────────────────────────────
//
// Request/reply RPC for the Mumble `UserStats` query. Unlike moderation
// (fire-and-forget), the moderator's client is waiting for a reply, so
// the owner of the target client builds the full reply and ships it back
// to the originator. Tag = 4 on the overlay's `ServiceRegistry`.
//
// The reply carries an opaque `payload` that is an *already-encoded*
// `MumbleProto.UserStats` message: the originator forwards it to the
// moderator's TLS stream as-is, no decode/re-encode round trip.

message UserStatsEnvelope {
  oneof kind {
    UserStatsRequest request = 1;
    UserStatsReply   reply   = 2;
  }
}

message UserStatsRequest {
  uint64 request_id    = 1;   // originator-assigned correlation id
  uint32 actor_session = 2;   // composite ClientSessionIdentifier of the moderator
  uint32 target_session = 3;  // composite ClientSessionIdentifier of the target
  bool   stats_only    = 4;   // mirrors UserStats.stats_only
  string server_id      = 5;   // empty/absent means "default" for legacy peers
}

message UserStatsReply {
  uint64 request_id = 1;       // mirrors request_id from the originating Request
  // Whether the owner found the target session in its local repository.
  // If false, `payload` is empty and the originator should silently drop
  // (matches the local-only behavior of returning Ok(())).
  bool   found      = 2;
  // Encoded `MumbleProto.UserStats` message body, ready to ship to the
  // moderator's TLS stream. The originator does *not* re-encode.
  bytes  payload    = 3;
}

// ── Plugin Data ───────────────────────────────────────────────────────────
//
// Direct client-to-client plugin payload fanout. The originator groups
// `receiver_sessions` by owning node and unicasts one envelope per node.
// The destination node forwards the payload to locally-owned recipient
// sessions only.

message PluginDataEnvelope {
  uint32 sender_session = 1;          // stamped by the originator
  repeated uint32 receiver_sessions = 2;
  bytes data = 3;
  optional string data_id = 4;
  string server_id = 5;               // empty/absent means "default" for legacy peers
}

// ── Text Messages ─────────────────────────────────────────────────────────
//
// Client-visible TextMessage fanout. The originator evaluates ACLs and
// visibility against the replicated client/channel view, groups the concrete
// recipient sessions by owning node, and the destination node writes the
// original TextMessage fields to locally-owned recipient sessions.

message TextMessageEnvelope {
  uint32 sender_session = 1;          // stamped by the originator
  repeated uint32 receiver_sessions = 2;
  repeated uint32 session = 3;        // original Mumble TextMessage.session
  repeated uint32 channel_id = 4;     // original Mumble TextMessage.channel_id
  repeated uint32 tree_id = 5;        // original Mumble TextMessage.tree_id
  string message = 6;
  string server_id = 7;               // empty/absent means "default" for legacy peers
}

// ── Voice ─────────────────────────────────────────────────────────────────

// Cross-node voice frame. The receiver does not decode `payload` — it is
// already an encoded UDP audio body (legacy or protobuf format) that the
// receiver hands directly to its local fan-out for per-recipient
// encryption. Codec-agnostic at this layer.
message VoiceFrame {
  uint32 sender_session = 1;   // composite ClientSessionIdentifier
  uint64 sender_epoch   = 2;   // sender's overlay boot_epoch; opaque
                                // repair-cache correlation metadata.
  uint64 s2s_seq        = 3;   // monotonic per (sender_session, sender_epoch);
                                // independent of the in-payload Mumble
                                // frame_number.
  uint32 target_kind    = 4;   // mirrors AudioContext: 0=NORMAL, 1=SHOUT,
                                // 2=WHISPER, 3=LISTEN
  bool   is_terminator  = 5;   // last frame of an utterance.
  bytes  payload        = 6;   // encoded UDP audio body, codec-agnostic
  VoiceIntent intent    = 7;   // unresolved routing intent. Receivers
                                // resolve this against local/replicated
                                // client and channel state.
  string server_id      = 8;   // empty/absent means "default" for legacy peers
  // Alternate copy proactively sent before a receiver requests repair. It may
  // bootstrap an empty reorder state but must not rebase an established cursor.
  // Absent is false for peers predating this field.
  bool proactive_copy   = 9;

  // Change-set C3 best-effort block FEC. When set, this frame is NOT part of
  // the data sequence: `payload` is a parity frame for the block named by
  // `fec_member_seqs` (all members have equal length, so reconstruction is
  // unambiguous), and receivers route it to the FEC window, never the
  // reorder. `s2s_seq` is the seq of the frame that completed the block
  // (correlation/debug only). `fec_parity_index` selects which parity equation
  // the payload carries: 0 is the plain XOR sum (recovers one missing member),
  // 1 is the GF(2^8) weighted sum with Vandermonde coefficient 2^index
  // (together with index 0, recovers two missing members). A peer that only
  // sends index 0 interoperates with receivers expecting either. Absent/false
  // for peers predating this field.
  bool fec_parity           = 10;
  repeated uint64 fec_member_seqs = 11;
  // Bit `i` set when member `i` of the block was an utterance terminator, so
  // a reconstruction can restore the flag.
  uint32 fec_terminator_mask = 12;
  uint32 fec_parity_index    = 13;
}

// Best-effort request for the origin node to replay recently-sent voice
// frames. Responses are ordinary VoiceFrame payloads on VOICE_SERVICE_TAG.
message VoiceRepairRequest {
  uint32 sender_session = 1;
  uint64 sender_epoch   = 2;
  uint64 first_seq      = 3;
  uint64 last_seq       = 4;
  uint64 request_sent_unix_ms = 5;
  uint32 request_ttl_ms       = 6;
  // When set, this is an acknowledgement that `last_seq` was emitted
  // contiguously and was the terminator for the sender's utterance. The
  // The existing repair service carries the acknowledgement. Older peers
  // decode it as a harmless one-frame repair request.
  bool tail_ack          = 7;
}

// Aggregate receiver playout report, sent only to the immediate upstream
// overlay peer once per reporting interval.
message VoicePathFeedback {
  uint32 received_frames = 1;
  uint32 gap_buffered = 2;
  uint32 deadline_flush = 3;
  // Longest chunk-hold delay (beyond the in-order skew tolerance) the
  // receiver had to impose on this peer's frames in the interval, in
  // microseconds. A route forcing the receiver to hold chunks raises the
  // sender's pressure on the next report instead of a slow average.
  uint32 max_held_delay_us = 4;
}

message VoiceIntent {
  oneof kind {
    VoiceIntentNormal normal = 1;
    VoiceIntentTarget target = 2;
  }
}

message VoiceIntentNormal {
  uint32 source_channel = 1;
}

message VoiceIntentTarget {
  uint32 source_channel = 1;
  repeated uint32 sessions = 2;
  repeated VoiceTargetChannel channels = 3;
}

message VoiceTargetChannel {
  uint32 id = 1;
  bool children = 2;
  bool links = 3;
  string group = 4;
}
