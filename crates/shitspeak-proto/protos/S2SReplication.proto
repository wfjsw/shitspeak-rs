syntax = "proto3";
package s2s_replication;

// Replication's service-tag entry in the opaque upper-layer capability
// envelope. This is interpreted only by the replication subsystem.
message ReplicationCapabilities {
  uint32 format_version = 1;
  bool strict_enabled = 2;
  bool content_enabled = 3;
  bool owner_enabled = 4;
  // Cumulative strict participant version. Zero is unsupported, including
  // while an enabled participant's durability/readiness gates are closed.
  uint32 strict_participant_protocol_version = 5;
}

// Outer envelope for replications. Carried as the `payload` of an
// overlay `OverlayData` frame with `service_tag = 1`.
message ReplicationMessage {
  string topic = 1;            // "channels" | "bans" | "clients" (free-form)
  oneof body {
    StrictMessage strict = 2;
    OwnerMessage  owner  = 3;
    BlobMessage   blob   = 4;
  }
}

// ------- Strict (Tempo) -------

message StrictMessage {
  oneof body {
    StrictPropose        propose         = 1;
    StrictProposeAck     propose_ack     = 2;
    StrictCommit         commit          = 3;
    StrictClockTick      clock_tick      = 4;
    StrictCatchupReq     catchup_req     = 5;
    StrictCatchupResp    catchup_resp    = 6;
    StrictRecoveryReq    recovery_req    = 7;
    StrictRecoveryAck    recovery_ack    = 8;
    StrictRecoveryCommit recovery_commit = 9;
    StrictAccept         accept          = 10;
    StrictAcceptAck      accept_ack      = 11;
    StrictResolutionHint resolution_hint = 12;
    StrictResolutionPrepare resolution_prepare = 13;
    StrictResolutionAck  resolution_ack  = 14;
    StrictDecision       decision        = 15;
    // Deliberately separate from the legacy `propose` tag. Older binaries
    // ignore this cumulative-protocol body instead of treating it as a
    // recoverable legacy proposal after dropping unknown fields.
    StrictProposeV1     propose_v1      = 16;
  }
  // End-to-end origin proof for routed strict traffic. The signature binds
  // the topic, oneof body, logical source node, and source boot epoch; it is
  // intentionally separate from hop-authenticated transport framing so
  // relays can preserve it unchanged.
  StrictOriginAuth origin_auth = 17;
}

message StrictOriginAuth {
  uint32 origin_node = 1;
  uint64 origin_boot_epoch = 2;
  uint32 signature_scheme = 3;
  repeated bytes certificate_chain = 4;
  bytes signature = 5;
}

message StrictPropose {
  uint32 coord_node = 1;
  uint64 op_id_hi   = 2;   // 128-bit op id, hi||lo
  uint64 op_id_lo   = 3;
  uint64 ts_propose = 4;
  bytes  op_msgpack = 5;
  uint64 src_clock  = 6;   // sender's clock at send time (piggyback)
}

// Cumulative strict protocol proposals. New protocol versions continue to
// use this separate body and raise `protocol_version`; a legacy decoder
// silently ignores the unknown oneof tag.
//
// Protocol v2 freezes the target membership with each proposal and later
// resolution message. An empty list is accepted only as descriptor-less
// legacy compatibility data.
message StrictFrozenTarget {
  uint32 node       = 1;
  uint64 boot_epoch = 2;
}

message StrictProposeV1 {
  uint32 coord_node = 1;
  uint64 op_id_hi   = 2;
  uint64 op_id_lo   = 3;
  uint64 ts_propose = 4;
  bytes  op_msgpack = 5;
  uint64 src_clock  = 6;
  uint32 protocol_version = 7;
  repeated StrictFrozenTarget frozen_targets = 8;
}

message StrictProposeAck {
  uint32 ack_node   = 1;
  uint32 coord_node = 2;
  uint64 op_id_hi   = 3;
  uint64 op_id_lo   = 4;
  uint64 ts_local   = 5;   // ack-side clock after advance
  uint64 src_clock  = 6;
  uint64 ack_boot_epoch = 7; // physical sender incarnation
}

message StrictCommit {
  uint32 coord_node = 1;
  uint64 op_id_hi   = 2;
  uint64 op_id_lo   = 3;
  uint64 ts_final   = 4;
  bytes  op_msgpack = 5;
  uint64 src_clock  = 6;
}

message StrictClockTick {
  uint32 src_node  = 1;
  uint64 src_clock = 2;
}

message StrictCatchupReq {
  uint32 src_node      = 1;
  uint64 since_version = 2;
  uint64 chunk_token   = 3;   // 0 = first chunk; >0 = continuation
  bool   force_snapshot = 4;  // true for startup history election
  bool   history_probe_only = 5; // true = return only history rank metadata
  // Cursor into the stable, op-id-sorted terminal-fence journal.
  uint64 terminal_state_cursor = 6;
  // v2 only: terminal-decision generation from the last complete terminal
  // fence sync with this source. A responder re-pages fences when it differs.
  uint64 terminal_decision_generation = 7;
  // v2 only: a nonzero value resumes one immutable snapshot image selected
  // by this responder. Zero starts (or safely restarts) a transfer.
  uint64 snapshot_transfer_id = 8;
  // Byte offset of the requested snapshot chunk. This is meaningful only
  // with a nonzero `snapshot_transfer_id`.
  uint64 snapshot_chunk_cursor = 9;
}

message StrictCatchupResp {
  uint64 snapshot_version       = 1;
  bytes  snapshot_msgpack       = 2;
  repeated CatchupOp ops        = 3;
  bool   has_more               = 4;
  uint64 next_chunk_token       = 5;
  bool   too_old_use_snapshot   = 6;
  uint64 history_version        = 7;
  int64  history_freshness      = 8;  // unix seconds of newest known op/snapshot
  uint64 runtime_started_at     = 9;  // overlay boot_epoch; lower = longer running
  uint32 history_node           = 10;
  repeated StrictTerminalState terminal_states = 11;
  uint64 next_terminal_state_cursor = 12;
  bool   terminal_states_has_more = 13;
  // A terminal-only page preserves the history request that must resume once
  // fence pagination reaches the end.
  bool   terminal_sync_only = 14;
  bool   request_force_snapshot = 15;
  bool   request_history_probe_only = 16;
  // Generation of the stable terminal-fence cut represented by this response.
  // A v2 receiver echoes it only after all terminal pages have been applied.
  uint64 terminal_decision_generation = 17;
  // v2-only immutable snapshot-transfer identity and chunk framing. The
  // legacy `snapshot_msgpack` field carries exactly one bounded chunk when
  // `snapshot_transfer_id` is nonzero.
  uint64 snapshot_transfer_id = 18;
  uint64 snapshot_chunk_cursor = 19;
  uint64 snapshot_next_cursor = 20;
  uint64 snapshot_total_bytes = 21;
  bytes  snapshot_sha256 = 22;
  bool   snapshot_has_more = 23;
  // The source could not safely retain or serve the requested aggregate
  // image under its resource limit. A v2 receiver restarts history election
  // rather than treating this as an empty snapshot.
  bool   snapshot_transfer_rejected = 24;
}

message CatchupOp {
  uint64 version          = 1;
  bytes  op_msgpack       = 2;
  uint64 strict_op_id_hi  = 3; // strict-mode repair metadata; 0 when absent
  uint64 strict_op_id_lo  = 4;
  uint64 strict_ts_final  = 5;
  // A strict v2 history entry carries its terminal commit proof. This closes
  // the race where a terminal-page snapshot predates a concurrently delivered
  // commit: the sink persists this descriptor-bearing fence before buffering
  // the ordinary history operation.
  uint64 strict_terminal_ballot = 6;
  uint32 strict_terminal_resolver_node = 7;
  uint64 strict_terminal_resolver_boot_epoch = 8;
  repeated StrictFrozenTarget strict_terminal_frozen_targets = 9;
}

// Tempo slow-path: coordinator-failure recovery (two-phase Paxos per op_id).

// Phase 1 — Prepare. Sent by a deterministic takeover when a coord is
// suspected dead, asking every replica to promise no future ballot < this
// one and to report any state for op_id they hold.
message StrictRecoveryReq {
  uint32 takeover_node = 1;
  uint64 ballot        = 2;       // (takeover_node << 32) | attempt_counter
  uint32 coord_node    = 3;       // failed coordinator's id
  uint64 op_id_hi      = 4;
  uint64 op_id_lo      = 5;
  uint64 src_clock     = 6;
}

// Phase 1 reply.
message StrictRecoveryAck {
  uint32 ack_node           = 1;
  uint64 ballot             = 2;
  uint32 coord_node         = 3;
  uint64 op_id_hi           = 4;
  uint64 op_id_lo           = 5;
  bool   promised           = 6;  // false = ack_node already promised >= ballot
  bool   has_committed      = 7;
  uint64 committed_ts_final = 8;  // valid iff has_committed
  bool   has_op             = 9;  // true iff ack_node holds a pending Propose
  uint64 ts_local           = 10; // 0 if !has_op
  bytes  op_msgpack         = 11; // empty if !has_op
  uint64 src_clock          = 12;
  uint64 ack_boot_epoch     = 13; // physical sender incarnation
}

// Phase 2 — Accept-and-Commit. Once the takeover has a recovery quorum of
// promises, it picks ts_final + op_msgpack and broadcasts this. Replicas
// accept iff `ballot >= recovery_promises[op_id]`.
message StrictRecoveryCommit {
  uint32 takeover_node = 1;
  uint64 ballot        = 2;
  uint32 coord_node    = 3;
  uint64 op_id_hi      = 4;
  uint64 op_id_lo      = 5;
  uint64 ts_final      = 6;
  bytes  op_msgpack    = 7;
  uint64 src_clock     = 8;
}

// ------- Strict terminal resolution (current v2, legacy-compatible decoding) -------
//
// Current binaries originate these messages only once every active S2S member
// has advertised the current cumulative strict-replication version. The
// descriptor-less legacy forms remain decodable for compatibility; tags 1..9
// above retain the legacy wire path for older nodes during a rollout.

// Phase 2 of a coordinator commit. The coordinator must collect an accept
// quorum before broadcasting the terminal `StrictDecision`.
message StrictAccept {
  uint32 coord_node = 1;
  uint64 ballot     = 2;
  uint64 op_id_hi   = 3;
  uint64 op_id_lo   = 4;
  uint64 ts_final   = 5;
  bytes  op_msgpack = 6;
  uint64 src_clock  = 7;
}

message StrictAcceptAck {
  uint32 ack_node       = 1;
  uint32 coord_node     = 2;
  uint64 ballot         = 3;
  uint64 op_id_hi       = 4;
  uint64 op_id_lo       = 5;
  bool   accepted        = 6;
  uint64 src_clock       = 7;
  uint64 ack_boot_epoch  = 8;
}

// An advisory report from a replica that has retained an unresolved proposal.
// The deterministic resolver uses it to start a quorum-backed resolution.
message StrictResolutionHint {
  uint32 reporter_node       = 1;
  uint32 coord_node          = 2;
  uint64 op_id_hi            = 3;
  uint64 op_id_lo            = 4;
  uint64 ts_local            = 5;
  bytes  op_msgpack          = 6;
  uint64 src_clock           = 7;
  uint64 reporter_boot_epoch = 8;
  uint32 protocol_version    = 9;
  repeated StrictFrozenTarget frozen_targets = 10;
}

// Resolution phase 1. A higher ballot promises that ordinary commit and
// lower-ballot resolution messages cannot subsequently win for this op id.
message StrictResolutionPrepare {
  uint32 resolver_node = 1;
  uint64 ballot        = 2;
  uint32 coord_node    = 3;
  uint64 op_id_hi      = 4;
  uint64 op_id_lo      = 5;
  uint64 src_clock     = 6;
  repeated StrictFrozenTarget frozen_targets = 7;
}

// A value accepted by the descriptor-less legacy accept path. A resolver that
// observes multiple accepted values must select the one at the highest ballot.
message StrictAcceptedValue {
  uint64 ballot     = 1;
  uint64 ts_final   = 2;
  bytes  op_msgpack = 3;
}

// A prepared proposal that has not been accepted. This lets a resolver
// recover the original value when its configured policy permits that outcome.
message StrictPendingValue {
  uint64 ts_local   = 1;
  bytes  op_msgpack = 2;
  uint32 protocol_version = 3;
}

// Resolution phase 1 reply. `observed` is intentionally a oneof: a terminal
// decision dominates an accepted value, which dominates a merely pending
// proposal. Absence means the replica knows no value for the op id.
message StrictResolutionAck {
  uint32 ack_node          = 1;
  uint64 ballot            = 2;
  uint32 coord_node        = 3;
  uint64 op_id_hi          = 4;
  uint64 op_id_lo          = 5;
  bool   promised          = 6;
  oneof observed {
    StrictTerminalState terminal = 7;
    StrictAcceptedValue accepted = 8;
    StrictPendingValue  pending  = 9;
  }
  uint64 src_clock         = 10;
  uint64 ack_boot_epoch    = 11;
}

// A terminal outcome is a durable fence. Commit carries the operation that
// must be delivered; abort has no payload and rejects every later commit.
message StrictDecisionCommit {
  uint64 ts_final   = 1;
  bytes  op_msgpack = 2;
}

message StrictDecisionAbort {}

message StrictDecision {
  uint32 resolver_node = 1;
  uint64 ballot        = 2;
  uint32 coord_node    = 3;
  uint64 op_id_hi      = 4;
  uint64 op_id_lo      = 5;
  oneof outcome {
    StrictDecisionCommit commit = 6;
    StrictDecisionAbort  abort  = 7;
  }
  uint64 src_clock     = 8;
  // v2 decision identity. A cold receiver verifies that the decision sender
  // is the exact resolver incarnation from the immutable target descriptor.
  // Default/empty fields are accepted only as descriptor-less legacy data.
  uint64 resolver_boot_epoch = 9;
  repeated StrictFrozenTarget frozen_targets = 10;
}

// Catchup representation of a terminal decision. Legacy terminal states leave
// the v2 identity fields empty. A v2 state carries the exact resolver
// incarnation and frozen target descriptor so a joining replica never turns a
// v2 fence into descriptor-less legacy state.
message StrictTerminalState {
  uint32 coord_node = 1;
  uint64 op_id_hi   = 2;
  uint64 op_id_lo   = 3;
  uint64 ballot     = 4;
  oneof outcome {
    StrictDecisionCommit commit = 5;
    StrictDecisionAbort  abort  = 6;
  }
  uint32 resolver_node       = 7;
  uint64 resolver_boot_epoch = 8;
  repeated StrictFrozenTarget frozen_targets = 9;
}

// ------- Owner-scoped -------

message OwnerMessage {
  oneof body {
    OwnerOp           op           = 1;
    OwnerCatchupReq   catchup_req  = 2;
    OwnerCatchupResp  catchup_resp = 3;
  }
}

message OwnerOp {
  uint32 origin_node    = 1;
  uint64 origin_epoch   = 2;   // origin's overlay boot_epoch
  uint64 origin_version = 3;
  bytes  op_msgpack     = 4;
}

message OwnerCatchupReq {
  uint32 origin_node    = 1;
  uint32 src_node       = 2;
  uint64 known_epoch    = 3;
  uint64 since_version  = 4;
  uint64 chunk_token    = 5;
}

message OwnerCatchupResp {
  uint32 origin_node            = 1;
  uint64 origin_epoch           = 2;
  uint64 snapshot_version       = 3;
  bytes  snapshot_msgpack       = 4;
  repeated CatchupOp ops        = 5;
  bool   has_more               = 6;
  uint64 next_chunk_token       = 7;
  bool   too_old_use_snapshot   = 8;
}

// ------- Content-addressed blobs -------

// Blob mode is intentionally not a synchronization protocol. A node asks the
// cluster for immutable content only after a local content-addressed store miss.
// Any node that has the blob can offer and serve chunks; the requester validates
// the final content hash before storing and then becomes another seed.
message BlobMessage {
  oneof body {
    BlobFind     find      = 1;
    BlobOffer    offer     = 2;
    BlobChunkReq chunk_req = 3;
    BlobChunk    chunk     = 4;
  }
}

message BlobFind {
  uint64 request_id = 1;
  uint32 requester  = 2;
  string key        = 3; // lowercase SHA-1 hex
  uint32 chunk_size = 4;
}

message BlobOffer {
  uint64 request_id = 1;
  uint32 provider   = 2;
  string key        = 3;
  uint64 size       = 4;
  uint32 chunk_count = 5;
  uint32 chunk_size = 6;
}

message BlobChunkReq {
  uint64 request_id = 1;
  uint32 requester  = 2;
  string key        = 3;
  repeated uint32 indexes = 4;
  uint32 chunk_size = 5;
}

message BlobChunk {
  uint64 request_id = 1;
  uint32 provider   = 2;
  string key        = 3;
  uint32 index      = 4;
  uint32 chunk_size = 5;
  uint64 total_size = 6;
  bytes data        = 7;
}
