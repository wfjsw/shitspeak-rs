syntax = "proto3";
package s2s_overlay;

// Outermost overlay envelope. Carried as the `payload` of a transport
// `Frame`. Higher layers never see this directly — the overlay decodes,
// dispatches by `body` variant, and forwards application data via its
// own inbound channels (`OverlayData` for L3 services).
message OverlayMessage {
  oneof body {
    Hello         hello          = 1;
    HelloAck      hello_ack      = 2;
    LsaFlood      lsa_flood      = 3;
    LsdbSync      lsdb_sync      = 4;   // request: digest of what sender has
    LsdbSyncResp  lsdb_sync_resp = 5;   // response: LSAs requester is missing/stale
    OverlayData   data           = 6;
    OverlayControl control       = 7;
  }
}

// Direct-neighbor liveness probe. Sent over the L1 stream to a single
// directly-connected peer every `hello_interval`. Carries the local
// `boot_epoch` so the receiver can spot a restart without waiting for an
// LSA. RTT is computed by echoing `ts_send_us`.
message Hello {
  uint32 src_node       = 1;
  uint64 src_boot_epoch = 2;
  uint64 nonce          = 3;
  uint64 ts_send_us     = 4;  // sender's monotonic clock at send
}

message HelloAck {
  uint32 src_node       = 1;
  uint64 src_boot_epoch = 2;
  uint64 nonce          = 3;
  uint64 ts_send_us     = 4;  // echoed from Hello
}

// One link-state advertisement. (origin, boot_epoch, seq) identifies the
// LSA instance; later seq replaces earlier seq for the same instance;
// higher boot_epoch supersedes lower (= node restart).
message LinkStateAdvert {
  uint32 origin     = 1;
  uint64 boot_epoch = 2;   // origin's wall clock at boot, μs since epoch
  uint64 seq        = 3;   // monotonic per (origin, boot_epoch)
  uint64 ts_emit_us = 4;   // wall clock at emit; informational
  bool   tombstone  = 5;   // graceful-leave marker
  repeated AddressEntry addresses = 6;  // origin's own listen addresses
  repeated LinkAdvert links = 7;
  uint64 max_users = 8;     // origin's local max_users capacity
  bool transit_disabled = 9; // origin should not be used as a transit router
  bool strict_replication_disabled = 10;  // origin does not run strict replication
  bool content_replication_disabled = 11; // origin does not run content/blob replication
  bool owner_replication_disabled = 12;   // origin does not run owner-scoped replication
}

// One advertised edge from `origin` to `neighbor`.
message LinkAdvert {
  uint32 neighbor        = 1;
  uint64 rtt_us          = 2;
  uint64 jitter_us       = 3;
  uint64 throughput_bps  = 4;
  uint32 transports_mask = 5;  // bitmap of TransportKind values; 1<<Tcp etc.
  uint32 loss_ppm        = 6;  // Conservative effective loss, parts per million.
  uint32 probe_loss_ppm  = 7;  // Probe/keepalive loss, parts per million.
  uint32 native_loss_ppm = 8;  // Native transport declared-loss rate, parts per million.
  uint32 data_health_ppm = 9;  // Stream data-health failure rate, parts per million.
  uint64 loss_sample_count = 10; // Samples behind the current loss breakdown.
  uint64 observed_recv_bps = 11; // Passive payload bytes/sec received by origin from neighbor.
  uint64 observed_sent_bps = 12; // Passive payload bytes/sec sent by origin to neighbor.
  uint32 throughput_confidence_ppm = 13; // Confidence in observed throughput, parts per million.
}

// Address entry (kept compatible with Phase 1's existing AddressEntry).
message AddressEntry {
  string addr      = 1;
  uint32 transport = 2;  // 0=Tcp, 1=Kcp, 2=Quic, 3=Udp
}

// Reliable flood envelope. Carries one or more LSAs in a single transport
// frame to amortize header cost during burst (e.g., right after a
// neighbor-up triggers updates from many origins).
message LsaFlood {
  repeated LinkStateAdvert advertisements = 1;
}

// Used for both partition-heal pull and periodic anti-entropy. The sender
// includes a compact digest of what it currently has; an empty digest is a
// "send me everything" pull (used right after a previously-down direct
// link comes back). The receiver responds with only the LSAs the sender is
// missing or has stale. Idempotent and bandwidth-bounded.
message LsdbSync {
  uint32 src_node = 1;
  repeated DigestEntry have = 2;   // empty = full pull
}

message DigestEntry {
  uint32 origin     = 1;
  uint64 boot_epoch = 2;
  uint64 seq        = 3;
}

message LsdbSyncResp {
  repeated LinkStateAdvert delta = 1;
}

// Application-data envelope. Routed across the overlay using per-service-
// level routing tables unless `route_metric` requests an upper-layer
// override. Forwarders consume `dsts` (subtract self, add to `path_trace`),
// pick next hops, and re-fanout. `service_tag` lets the receiver dispatch to
// the right handler (replications, etc.).
message OverlayData {
  uint32 src              = 1;
  repeated uint32 dsts    = 2;   // remaining destinations after this hop
  repeated uint32 path_trace = 3;
  uint32 service_tag      = 4;
  uint32 service_level    = 5;   // matches shitspeak_s2s_transport::ServiceLevel
  uint32 message_class    = 6;   // matches shitspeak_s2s_transport::MessageClass
  bytes  payload          = 7;
  bool   process_on_transit = 8; // deliver to local service on transit hops too
  uint32 route_metric     = 9;   // 0=legacy per-service default, 1=conversational, 2..4=level defaults
  bool   ordered_delivery = 10;  // legacy hint; receivers order by lane_id presence
  uint64 ordering_seq     = 11;  // sender-monotonic per (lane, final destination)
  uint32 ordering_dst     = 12;  // final destination for ordering_seq
  optional uint32 lane_id = 13;  // present => ordered lane; absent => unordered
  uint64 origin_boot_epoch = 14;
  uint64 origin_message_id = 15;
  bool allow_l1_compression = 16;
}

message OverlayControl {
  uint32 origin = 1;
  uint64 origin_boot_epoch = 2;
  uint32 final_dst = 3;
  uint32 lane_id = 4;
  uint32 requester = 5;

  oneof body {
    OverlayAck ack = 10;
    OverlayRepairRequest repair_request = 11;
    OverlayRepairResponse repair_response = 12;
  }
}

message OverlayAck {
  uint64 next_seq = 1; // cumulative ACK: all seq < next_seq received/delivered
}

message OverlayRepairRequest {
  uint64 first_seq = 1;
  uint64 last_seq = 2; // inclusive
}

message OverlayRepairResponse {
  repeated OverlayData packets = 1;
  bool not_found = 2;
}
