[workspace]
members = [
    ".",
    "crates/shitspeak-auth",
    "crates/shitspeak-core",
    "crates/shitspeak-client-crypto",
    "crates/shitspeak-messages",
    "crates/shitspeak-proto",
    "crates/shitspeak-runtime-config",
    "crates/shitspeak-runtime",
    "crates/shitspeak-state",
    "crates/shitspeak-s2s",
    "crates/shitspeak-s2s-transport",
    "crates/shitspeak-voice",
    "crates/shitspeak-web",
    "crates/message_macro",
    "vendor/kcp",
    "vendor/tokio_kcp",
]
resolver = "3"

[workspace.package]
version = "3.0.0"
edition = "2024"

[workspace.dependencies]
arc-swap = "1"
async-trait = "0"
aws-lc-rs = "1"
base64 = "0"
bytes = { version = "1", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0", features = ["serde"] }
cidr = "0"
config = { version = "0", default-features = false, features = ["toml"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
enumflags2 = { version = "0", features = ["serde"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
hang = "0.16"
hex = "0"
kcp = { path = "vendor/kcp" }
libc = "0"
maxminddb = { version = "0", features = ["mmap", "simdutf8"] }
message_macro = { path = "crates/message_macro" }
miniz_oxide = "0.8.9"
moq-lite = "0.16"
moq-native = { version = "0.14", default-features = false, features = ["quinn", "aws-lc-rs"] }
notify = "8"
num_enum = "0"
os_info = "3"
parking_lot = { version = "0", features = ["arc_lock", "hardware-lock-elision", "owning_ref", "serde"] }
paste = "1"
ppp = "2"
prost = "0"
prost-build = "0.14.3"
prost-types = "0"
protoc-bin-vendored = "3"
quinn = { version = "0", default-features = false, features = ["log", "platform-verifier", "runtime-tokio", "rustls-aws-lc-rs", "bloom"] }
rand = "0.10"
rayon = "1"
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "x509-parser", "pem"] }
reqwest = { version = "0.13", default-features = false, features = ["charset", "http2", "rustls", "stream"] }
rmp-serde = "1"
rusqlite = { version = "0", features = ["bundled", "serialize"] }
rustc-hash = "2"
rustls = "0"
rustls-pemfile = "2"
rustls-pki-types = "1"
scc = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0", features = ["all"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0"
tokio-util = { version = "0.7", features = ["codec"] }
tokio_kcp = { path = "vendor/tokio_kcp" }
tracing = "0.1"
tracing-appender = { version = "0", features = ["parking_lot"] }
tracing-subscriber = { version = "0", features = ["parking_lot", "serde", "env-filter", "registry"] }
tracing-test = "0.2"
wasmtime = { version = "45", default-features = false, features = ["async", "cranelift", "runtime"] }
webrtc = "0.17"
webpki-roots = "1"
x509-parser = "0"
zstd = { version = "0", default-features = false, features = ["zdict_builder"] }
shitspeak-proto = { path = "crates/shitspeak-proto" }
shitspeak-auth = { path = "crates/shitspeak-auth" }
shitspeak-core = { path = "crates/shitspeak-core" }
shitspeak-client-crypto = { path = "crates/shitspeak-client-crypto" }
shitspeak-messages = { path = "crates/shitspeak-messages" }
shitspeak-runtime = { path = "crates/shitspeak-runtime" }
shitspeak-runtime-config = { path = "crates/shitspeak-runtime-config" }
shitspeak-s2s = { path = "crates/shitspeak-s2s" }
shitspeak-s2s-transport = { path = "crates/shitspeak-s2s-transport" }
shitspeak-state = { path = "crates/shitspeak-state" }
shitspeak-voice = { path = "crates/shitspeak-voice" }
shitspeak-web = { path = "crates/shitspeak-web" }

[package]
name = "shitspeak-rs"
version.workspace = true
edition.workspace = true

[dependencies]
clap = { workspace = true }
shitspeak-runtime = { workspace = true }
shitspeak-web = { workspace = true, optional = true }
config = { workspace = true }
libc = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
criterion = { workspace = true }
enumflags2 = { workspace = true }
parking_lot = { workspace = true }
prost = { workspace = true }
rayon = { workspace = true }
rcgen = { workspace = true }
shitspeak-client-crypto = { workspace = true }
shitspeak-messages = { workspace = true }
rustls = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
zstd = { workspace = true }

[features]
default = []
web = ["dep:shitspeak-web"]
moq = ["web", "shitspeak-web/moq"]
pre-release-workload = ["shitspeak-runtime/pre-release-workload"]

[[bin]]
name = "shitspeak-rs"
path = "src/main.rs"
test = false

[[bin]]
name = "s2s-forwarder"
path = "src/bin/s2s-forwarder.rs"
test = false

[[bench]]
name = "acl"
harness = false

[[bench]]
name = "voice_hotpath"
harness = false

[[bench]]
name = "voice_e2e"
harness = false

[[bench]]
name = "voice_microbatch"
harness = false

[[bench]]
name = "s2s_compression"
harness = false

[[bench]]
name = "fanout_vs_broadcast"
harness = false

[profile.dev]
incremental = false

[profile.release]
incremental = false
lto = true

[profile.test]
incremental = false

[profile.bench]
incremental = false
