[package]
name = "shitspeak-rs"
version = "3.0.0"
edition = "2024"

[dependencies]
aws-lc-rs = "1"
base64 = "0"
bytes = { version = "1", features = ["serde"] }
chrono = { version = "0", features = ["serde"] }
cidr = "0"
config = "0"
notify = "8"
enumflags2 = { version = "0", features = ["serde"] }
hex = "0"
libc = "0"
maxminddb = { version = "0", features = ["mmap", "simdutf8"] }
num_enum = "0"
paste = "1"
ppp = "2"
prost = "0"
prost-types = "0"
rustls = "0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["charset", "http2", "rustls", "stream"] }
socket2 = { version = "0", features = ["all"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0"
tracing = "0.1"
wasmtime = { version = "45", default-features = false, features = ["async", "cranelift", "parallel-compilation", "runtime"] }
webpki-roots = "1"
tracing-appender = { version = "0", features = ["parking_lot"] }
tracing-subscriber = { version = "0", features = ["parking_lot", "serde", "env-filter", "registry"] }
x509-parser = "0"
zstd = "0"

# local proc-macro to derive message helpers
message_macro = { path = "src/messages/macros" }
os_info = "3"
async-trait = "0"
rusqlite = { version = "0", features = ["bundled"] }
parking_lot = { version = "0", features = ["arc_lock", "hardware-lock-elision", "owning_ref", "serde"] }
scc = "3"
quinn = { version = "0", default-features = false, features = ["log", "platform-verifier", "runtime-tokio", "rustls-aws-lc-rs", "bloom"] }
tokio_kcp = "0"
rustls-pemfile = "2"
rustls-pki-types = "1"
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "x509-parser", "pem"] }
rand = "0.10"
arc-swap = "1"
rmp-serde = "1"
rayon = "1"
webrtc = { version = "0.17", optional = true }
moq-lite = { version = "0.16", optional = true }
moq-native = { version = "0.14", default-features = false, features = ["quinn", "aws-lc-rs"], optional = true }
hang = { version = "0.16", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[patch.crates-io]
kcp = { path = "vendor/kcp" }
tokio_kcp = { path = "vendor/tokio_kcp" }

[features]
default = []
web = ["dep:webrtc"]
moq = ["web", "dep:moq-lite", "dep:moq-native", "dep:hang"]

[[bin]]
name = "shitspeak-rs"
path = "src/main.rs"
test = false

[[bin]]
name = "s2s-forwarder"
path = "src/bin/s2s-forwarder.rs"
test = false

[build-dependencies]
chrono = "0.4.41"
prost-build = "0.14.3"
protoc-bin-vendored = "3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
miniz_oxide = "0.8.9"

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "x509-parser", "pem"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
tempfile = "3"
tracing-test = "0.2"

[[bench]]
name = "acl"
harness = false

[[bench]]
name = "voice_hotpath"
harness = false

[[bench]]
name = "voice_e2e"
harness = false

[[bench]]
name = "voice_microbatch"
harness = false

[[bench]]
name = "s2s_compression"
harness = false

[profile.dev]
incremental = false

[profile.release]
incremental = false
lto = true

[profile.test]
incremental = false

[profile.bench]
incremental = false
