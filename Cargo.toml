[package]
name = "shitspeak-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
aws-lc-rs = "1.15.2"
base64 = "0.22.1"
bytes = { version = "1.11.0", features = ["serde"] }
chrono = { version = "0.4.41", features = ["serde"] }
cidr = "0.3.2"
config = "0.15.19"
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }
enumflags2 = { version = "0.7.12", features = ["serde"] }
hex = "0.4.3"
libc = "0.2"
maxminddb = { version = "0.28.1", features = ["mmap", "simdutf8"] }
num_enum = "0.7.5"
paste = "1.0.15"
ppp = "2.3.0"
prost = "0.14.3"
prost-types = "0.14.3"
rustls = "0.23.35"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.3", default-features = false, features = ["charset", "http2", "rustls", "stream"] }
sha1 = "0.11.0"
socket2 = { version = "0.6", features = ["all"] }
thiserror = "2.0.17"
tokio = { version = "1.45.0", features = ["full"] }
tokio-rustls = "0.26.4"
tracing = "0.1"
wasmtime = "45.0.0"
tracing-appender = { version = "0.2.4", features = ["parking_lot"] }
tracing-subscriber = { version = "0.3.22", features = ["parking_lot", "serde", "env-filter"] }
x509-parser = "0.18.1"

# local proc-macro to derive message helpers
message_macro = { path = "src/messages/macros" }
os_info = "3.14.0"
async-trait = "0.1.89"
rusqlite = { version = "0.39", features = ["bundled"] }
parking_lot = { version = "0.12.5", features = ["arc_lock", "hardware-lock-elision", "owning_ref", "serde"] }
scc = "3.7.1"
quinn = "0.11"
tokio_kcp = "0.9"
rustls-pemfile = "2"
rustls-pki-types = "1"
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "x509-parser", "pem"] }
rand = "0.10.1"
arc-swap = "1"
rmp-serde = "1"
rayon = "1"
webrtc = "0.17.1"
moq-lite = { version = "0.16.3", optional = true }
moq-native = { version = "0.14.1", default-features = false, features = ["quinn", "aws-lc-rs"], optional = true }
hang = { version = "0.16.0", optional = true }

[features]
default = []
moq = ["dep:moq-lite", "dep:moq-native", "dep:hang"]

[build-dependencies]
chrono = "0.4.41"
prost-build = "0.14.3"
protoc-bin-vendored = "3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rcgen = { version = "0.13", features = ["x509-parser", "pem"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
tempfile = "3"
tracing-test = "0.2"

[[bench]]
name = "acl"
harness = false

[[bench]]
name = "voice_hotpath"
harness = false

[[bench]]
name = "voice_e2e"
harness = false

[profile.dev]
incremental = false

[profile.release]
incremental = false

[profile.test]
incremental = false

[profile.bench]
incremental = false


