syntax = "proto3";

package s2s_transport;

// Wire-level service levels. Higher reliability has lower numeric value:
// SERVICE_RELIABLE < SERVICE_RELIABLE_LOW_LATENCY < SERVICE_BEST_EFFORT.
// A transport whose level is <= the requested level satisfies the request.
enum ServiceLevel {
  SERVICE_RELIABLE = 0;
  SERVICE_RELIABLE_LOW_LATENCY = 1;
  SERVICE_BEST_EFFORT = 2;
}

// Frame disposition. Data carries an opaque caller payload;
// the rest are protocol control frames generated by the transport itself.
enum FrameType {
  FRAME_DATA = 0;
  FRAME_HELLO = 1;
  FRAME_PING = 2;
  FRAME_PONG = 3;
  FRAME_KEEPALIVE = 4;
  FRAME_BYE = 5;
  // Stream-only control frame carrying an adaptive zstd dictionary in payload.
  FRAME_DICTIONARY = 6;
  // Stream-only control frame acknowledging an adaptive dictionary id.
  FRAME_DICTIONARY_ACK = 7;
}

// Receiver-side routing class. Selected by the sender to direct the frame
// to one of two inbound queues on the peer.
enum MessageClass {
  CLASS_HIGH_PRIORITY = 0;
  CLASS_REGULAR = 1;
  CLASS_CONTROL = 2;
}

// Encoding applied to Frame.payload on the L1 wire. Receivers restore
// IDENTITY bytes before dispatching to L2 and above.
enum PayloadEncoding {
  IDENTITY = 0;
  ZSTD = 1;
  // Zstd payload compressed with a negotiated configured or adaptive dictionary.
  // Stream peers advertise dictionary capability before this encoding is sent.
  ZSTD_DICT = 2;
}

// Carried by every send on every transport.
// Stream wire: [u32 BE encoded_len][prost-encoded Frame].
// Datagram wire (UDP): one prost-encoded Frame per datagram.
message Frame {
  uint32 src_node = 1;            // u16 in domain; uint32 on the wire
  uint32 dst_node = 2;
  ServiceLevel service_level = 3;
  FrameType frame_type = 4;
  MessageClass message_class = 5;
  // Field 6 was `seq` before vNext. It is intentionally reusable because
  // transport-level ordering moved to the overlay protocol.
  uint64 ts_us = 7;               // sender monotonic microseconds (ping RTT)
  bytes payload = 8;              // domain payload, opaque to transport
  PayloadEncoding payload_encoding = 9;
  uint64 uncompressed_payload_len = 10;
  // Non-zero for ZSTD_DICT frames and dictionary control frames. For adaptive
  // dictionaries this is a transport-generated id derived from the dictionary
  // bytes; peers must advertise and ack it before it is used for data.
  uint64 payload_dictionary_id = 11;
}
