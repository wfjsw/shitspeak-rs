# ShitSpeak server configuration for local testing

node_id = 1
listen = "0.0.0.0:64738"
opus_threshold = 100
register_name = "ShitSpeak Test"

# ── Public server registration ──────────────────────────────────────────
# Uncomment and fill in to register this server with the public Mumble
# server list.  All three fields are required for registration to activate.
# register_password = "your-registry-password"
# register_url = "https://publist-registration.mumble.info/v1/register"
# register_hostname = "my-server.example.com"
# register_location = "New York, USA"
cert_path = "cert.pem"
key_path = "key.pem"
send_version = true
send_build_info = true
send_os_info = true
allowed_proxies = []
min_client_version = 0
max_users = 100

# Mumble standard
welcome_text = "Welcome to ShitSpeak test server!"
max_bandwidth = 72000
allow_html = true
max_text_message_length = 5000
max_image_message_length = 131072
default_channel = 0
cert_required = false

# UDP
udp_voice_enabled = true
udp_ping_enabled = true
udp_channel_size = 2048

# Idle timeout (seconds)
client_idle_timeout_secs = 30

# Persistence
blob_storage_dir = "data"
channel_log_max_entries = 10000
client_log_max_entries = 10000
channel_snapshot_every_ops = 10
channel_snapshot_every_secs = 60
channel_wal_compaction_expire_count = 2000

# S2S (server-to-server)
[s2s]
enabled = false
bootstrap_nodes = []

# Optional listeners for future overlay transports
quic_listen = "0.0.0.0:64740"
tcp_listen = "0.0.0.0:64741"

# S2S PKI (separate from mumble cert_path/key_path)
cert_path = "s2s-cert.pem"
key_path = "s2s-key.pem"
ca_cert_path = "s2s-ca-cert.pem"

# If extension is missing/invalid, server still starts but S2S is disabled.
require_node_id_extension = true
node_id_extension_oid = "1.3.6.1.4.1.55555.1.1"

# Membership probe timers (milliseconds)
probe_interval_ms = 1000
probe_timeout_ms = 700
suspect_timeout_ms = 3000
dead_timeout_ms = 7000

# Presence repair and digest intervals (milliseconds)
anti_entropy_interval_ms = 1000
full_digest_interval_ms = 10000

# Route selection constraints
quality_stale_after_ms = 15000
