# ShitSpeak server configuration for local testing.
# See docs/configuration.md for loading rules, constraints, and deployment examples.

listen = "0.0.0.0:64738"
register_name = "ShitSpeak Test"

# ── Public server registration ──────────────────────────────────────────
# Registration requires the non-empty register_name above, register_password,
# register_url, and udp_ping_enabled = true. Hostname and location are optional.
# register_password = "your-registry-password"
# Public URL shown for this server in the registry response.
# register_url = "mumble://my-server.example.com:64738"
# register_hostname = "my-server.example.com"
# register_location = "New York, USA"
cert_path = "cert.pem"
key_path = "key.pem"
send_version = true
send_build_info = true
send_os_info = true
allowed_proxies = []
min_client_version = 0
max_users = 100

# Mumble standard
welcome_text = "Welcome to ShitSpeak test server!"
max_bandwidth = 72000
allow_html = true
max_text_message_length = 5000
max_image_message_length = 131072
root_channel_name = "Root"
default_channel = 1
cert_required = false
# When enabled, ChannelState messages include per-client permission hints
# (`is_enter_restricted` and `can_enter`), and ACL/enter changes send
# PermissionQuery refreshes.
send_permission_info = false
# When enabled, clients only see users/listeners in channels they can Traverse.
hide_users_without_traverse = false
# When enabled, clients only see channels they can Traverse. This is separate
# from hide_users_without_traverse so existing user-only filtering is preserved;
# it requires hide_users_without_traverse = true.
hide_channels_without_traverse = false
# When enabled, superusers see each user's hosting node id appended to display names.
show_node_id_for_superusers = true

# Require authenticated users to belong to at least one listed group. An empty
# list permits every successfully authenticated user.
required_groups = []

# UDP
udp_voice_enabled = true
udp_ping_enabled = true
# cluster = clusterwide user count and summed cluster max_users; local = this node only
# Per-port virtual-server UDP ping status can be overridden with
# [[server_entrypoints]].udp_ping_status_server_id; otherwise a listen entrypoint reports its server_id.
udp_ping_user_count_scope = "cluster"
# Native UDP voice processing queue floor. Effective capacity scales from max_users:
# baseline = max_users * 16 packets, burst = 5x baseline, hard cap = max_users * 128 packets.
udp_channel_size = 2048

# Idle timeout (seconds)
client_idle_timeout_secs = 30
# Authenticate timeout (milliseconds) after TLS setup.
authenticate_timeout_ms = 30000
# Number of clients allowed to run UDP crypt setup, authenticator work, and post-auth
# finalization concurrently. Set to 0 to disable the login queue and concurrency limit.
# Authenticator CPU runs on a bounded background-priority runtime regardless.
# Default when omitted: floor(3rd root(active CPU count)), minimum 1.
# auth_finalization_concurrency = 1
pending_delete_timeout_ms = 5000

# Persistence
blob_storage_dir = "data"
# Whether `user_channel_cache.db` also records sessions hosted on remote S2S
# nodes. Local sessions are always recorded when they have a cache key.
user_channel_cache_record_remote_sessions = false
channel_log_max_entries = 300
client_log_max_entries = 2000
channel_snapshot_every_ops = 10
channel_snapshot_every_secs = 60
channel_wal_compaction_expire_count = 2000

# Voice latency and UDP send-backpressure budgets (milliseconds).
# These values hot-reload. Higher age limits reduce drops during short stalls
# but allow older audio and make workers process more backlog.
[voice]
max_udp_packet_age_ms = 250
max_routing_queue_age_ms = 250
# Linux sendmmsg WouldBlock retry budget; 0 fails fast. Ignored on non-Linux.
udp_send_retry_budget_ms = 2

# Voice fan-out dispatch policy. The default calibrates separate, piecewise
# profiles for payloads up to and including 512 bytes and above 512 bytes
# before the server starts listening. Each calibrated breakpoint jointly sets
# a Rayon worker cap and minimum recipient-run size. Dispatch changes require
# a restart.
[voice.dispatch]
mode = "startup_calibrated" # startup_calibrated, sequential, fixed
# Fixed mode uses these values instead of benchmarking at startup. The value
# targets the recipient-run size; Rayon never receives more runs than workers.
# small_payload_rayon_threshold = 512
# small_payload_rayon_min_len = 256
# large_payload_rayon_threshold = 512
# large_payload_rayon_min_len = 256

# Authentication backend. Defaults to `demo`; other built-in backends are
# `wasm` and `exec`.
[authenticator]
backend = "demo"

# Leaky-bucket abuse protections on authentication (native + web). Zero
# disables the corresponding limit. Defaults: 2 attempts/sec per source IP
# with a burst of 10; 1 attempt/sec per account with a burst of 10.
# auth_rate_limit_per_ip_per_second = 2
# auth_rate_limit_ip_burst = 10
# auth_rate_limit_per_account_per_second = 1
# auth_rate_limit_account_burst = 10

# WASM authenticator configuration used when `backend = "wasm"`.
# [authenticator.wasm]
# path = "auth.wasm"
# file_access_dir = ["auth-files"]
# working_dir = "auth-files"

# ExecAuthenticator configuration. Requests are JSON lines on stdin; responses
# are JSON on stdout. Optional uid/gid dropping is supported on Unix.
# [authenticator.exec]
# mode = "exec_ephemeral" # exec_ephemeral, exec_long_running
# long_running_request_mode = "serialized" # serialized, async
# command = "auth-helper"
# args = []
# environment = { AUTH_ENDPOINT = "https://auth.example", AUTH_MODE = "production" }
# working_dir = "auth"
# uid = 1001
# gid = 1001
# timeout_ms = 30000
# max_response_bytes = 16777216

# ACL behavior toggles
[acl]
# Preserve historical superuser behavior by ignoring Enter denies.
# Set false to make superusers respect Enter ACLs.
debug_acl_enter = false
# When true, an explicit Enter deny stays denied even if Write is allowed.
explicit_enter_deny_overrides_write = true
# When true, registered non-superuser ACL editors keep a personal Write ACL if
# their edit would otherwise remove their own Write permission.
preserve_write_acl_on_edit = false
# When true, temporary channel creators receive local ACL grants for any missing
# Write, Enter, and Speak permissions not already inherited by the new channel.
grant_temp_channel_creator_acl = true
# When true, ACL edits reevaluate Speak for clients currently in the changed
# channel subtree and update their suppress state.
reevaluate_speak_on_acl_change = true
# When true, a moderator with the required Move permissions may move another
# user into a channel that user cannot Traverse. The default is false.
allow_move_without_traverse = false

# Privacy behavior toggles
[privacy]
# Controls how non-superuser clients see other users' certificate hashes in
# UserState.hash. Their own certificate hash remains raw.
# false = disabled; true or "irreversible" = stable one-way remap;
# "reversible" = stable AES-based remap reversible with the shared secret.
protect_certificate_hashes = false
# Required when protect_certificate_hashes is true, "irreversible", or
# "reversible". In clusters, every node must use the same secret. Prefer
# SHITSPEAK_PRIVACY__CERTIFICATE_HASH_SECRET.
# certificate_hash_secret = "replace-with-a-long-random-cluster-secret"

# Global GeoIP lookup for shared resolver use such as ACL IP masks. This is
# MaxMind/GeoLite2-backed; S2S topology observability uses Cloudflare
# check-perf endpoint probes unless manual [s2s.geo] coordinates are set.
[geoip]
enabled = true
maxmind_database_path = "GeoLite2-City.mmdb"
cache_ttl_secs = 86400
cache_capacity = 4096

# S2S (server-to-server)
# [s2s]
# Whether to advertise private RFC1918/ULA listen or advertise addresses into
# the cluster. Keep true for LAN/VPN/container clusters; set false for
# deployments where those private addresses should not be published.
# advertise_private_ips = true
# Optional interface-name allowlist for automatic local IP discovery. Useful
# for wildcard listeners on VPN interfaces such as Tailscale. Names are matched
# case-insensitively; on Windows the adapter name, friendly name, and
# description are checked.
# local_interface_advertise = ["tailscale0", "Tailscale"]

# Optional node geo location for topology dashboards. Manual coordinates take
# precedence; when omitted, the node probes Cloudflare check-perf endpoints to
# use the egress IP's observed city/region/country and coordinates. Failed
# probes retry with exponential backoff from one second to five minutes until
# the first valid result, which remains fixed for the lifetime of the process.
[s2s.geo]
# latitude = 32.7767
# longitude = -96.7970
# city = "Dallas"
# region = "TX"
# country = "US"
# source = "manual"

# ── L1 transport tunables ─────────────────────────────────────────────
# Per-link metrics smoothing (EWMA coefficients) and ping-cap.
[s2s.transport]
# Smoothing coefficient for the latency EWMA.
latency_ewma_alpha = 0.2
# Smoothing coefficient for the jitter EWMA (RFC 3550 uses 1/16).
jitter_ewma_alpha = 0.0625
# Smoothing coefficient for the long-term packet loss EWMA.
packet_loss_ewma_alpha = 0.02
# Fast transport keepalive interval used before a link has proven stable.
ping_interval_secs = 2
# Slower keepalive interval used after the first keepalive pong on a link.
idle_ping_interval_secs = 10
# How often stream transports sample native loss counters; zero disables it.
native_stats_interval_secs = 10
# Maximum write deadline for TCP/QUIC streams. KCP uses its native
# no-progress watchdog unless `no_progress_close_ms` is zero.
stream_write_timeout_ms = 1000
# Maximum time to establish and acknowledge all required QUIC v2 class lanes.
quic_session_setup_timeout_ms = 10000
# QUIC unreliable DATAGRAM queue budgets; enabled buffers must be at least
# 1200 bytes. Zero disables that local direction, but does not disable the
# s2s/2 ALPN offer or request s2s/1 fallback. Negotiated v2 setup fails when
# either local direction is disabled, so keep both nonzero for v2.
quic_datagram_send_buffer_bytes = 65536
quic_datagram_receive_buffer_bytes = 262144
# Cap on in-flight pings remembered per stream/UDP session.
max_pending_pings = 64
# Shared UDP-family S2S mux queues are sized from top-level max_users:
# baseline = max_users * 16 datagrams, burst = 5x baseline, hard cap = max_users * 128 datagrams.
# Exponential probing retry cap for peers seen recently.
recent_probe_retry_cap_secs = 30
# Exponential probing retry cap for peers not seen for stale_probe_age_secs.
stale_probe_retry_cap_secs = 600
# Age where a peer is considered old enough to use the stale retry cap.
stale_probe_age_secs = 3600
# When another direct path to a peer is already live, failed addresses that
# are neither currently advertised nor on the live remote IP back off in this
# 5-30 minute range and are removed after repeated capped failures.
unconfirmed_address_retry_floor_secs = 300
unconfirmed_address_retry_cap_secs = 1800
unconfirmed_address_decay_failures = 5
# Per-address outbound dial deadline; zero disables the deadline.
dial_attempt_timeout_secs = 10
# Ignore a discovered local/self seed for this long.
self_seed_quarantine_secs = 3600
# How often to sample one otherwise unselected peer/transport while the
# outgoing cap is full. Set to 0 to disable.
unselected_link_probe_interval_secs = 30
# Bound address attempts made for one peer in one discovery tick.
max_dial_attempts_per_peer_tick = 1
# Soft cap on live outbound S2S transport sessions. Inbound is still accepted.
max_outgoing_connections = 1024
# UDP-family sampling and health gates. Unhealthy datagram candidates are
# excluded; routing falls back to streams when neither raw UDP nor the QUIC
# DATAGRAM delivery path is viable and able to fit the frame.
udp_family_min_samples = 32
udp_family_probe_loss_block_count = 3
udp_family_block_loss_ppm = 250000
udp_family_loss_excess_over_tcp_ppm = 50000
# Shadow-only observation of the repair-feasibility boundary for BestEffort
# datagram delivery paths. Raw UDP uses weighted effective loss. QUIC DATAGRAM
# uses peer/path-local enqueue rejection and writer-failure evidence. Pressure,
# too-large, and ingress outcomes are diagnostic only. There is no DATAGRAM ACK
# or on-time/end-to-end loss signal. Suspect state never changes path selection
# or KCP behavior.
best_effort_datagram_effective_loss_suspect_ppm = 5000
best_effort_datagram_effective_loss_recover_ppm = 2500
best_effort_quic_datagram_health_suspect_ppm = 100000
best_effort_quic_datagram_health_recover_ppm = 10000
best_effort_datagram_suspect_bad_windows = 3
best_effort_datagram_recover_healthy_ms = 10000
large_rtt_threshold_ms = 100
lossy_link_threshold_ppm = 20000
bulk_payload_threshold_bytes = 65536
bulk_backlog_threshold_bytes = 262144
# For every BestEffort route, eligible raw UDP and fitting s2s/2 QUIC DATAGRAM
# paths are preferred over reliable streams. This percentage controls the
# measured improvement required for sticky challenger changes between
# otherwise comparable voice paths.
transport_switch_improvement_pct = 15
# For every BestEffort route, KCP remains a final fallback, but its measured
# routing cost is increased by this percentage. Reliable traffic is unaffected.
best_effort_kcp_cost_penalty_pct = 25
# An eligible datagram path may replace a reliable incumbent immediately;
# stickiness limits other changes.
# Keep expiring conversational voice on a stable transport/tree path while it
# remains usable. Changes take effect after restart; set false to roll back.
voice_path_stickiness_enabled = true
voice_path_min_hold_ms = 750
voice_path_challenger_confirm_ms = 500
voice_path_idle_reset_ms = 2000
# Route metrics older than this are treated as stale.
transport_metric_stale_after_ms = 1500
# Legacy queue capacity hints. Inbound and outbound transport queues now use
# adaptive byte budgets sized from available memory; these values only raise
# the per-lane minimum budget for compatibility with older configs.
# inbound_control_capacity = 16384
# inbound_high_capacity = 32768
# inbound_regular_capacity = 32768
# outbound_capacity = 131072
# Selective L1 payload compression. Callers still opt in per send.
compression_enabled = true
compression_min_bytes = 1024
compression_min_savings_percent = 10
compression_level = 1
# Learn per-stream zstd dictionaries from recent S2S payloads. Stream peers
# advertise support in transport Hello before dictionary frames are sent.
# When s2s.persistence_dir is set, the latest learned stream dictionary is
# cached below it and re-advertised for ack on restart before it is reused.
# UDP continues to use only identity/plain zstd unless an explicit dictionary is configured.
compression_adaptive_dictionary_enabled = true
# Optional static zstd dictionary for S2S L1 payload compression. Stream peers
# require a matching dictionary fingerprint; UDP peers have no dictionary
# negotiation, so configure identical bytes before using static dictionaries on UDP.
# compression_dictionary_path = "s2s-transport.zdict"

[s2s.transport.kcp]
nodelay = true
interval_ms = 10
fast_resend = 2
no_congestion = false
flush_write = true
flush_acks_input = true
failaway_with_alternative_ms = 250
failaway_without_alternative_ms = 750
no_progress_close_ms = 1500

# ── L3 voice distribution and repair ──────────────────────────────────
# Long-haul S2S transport and repair budgets. In-order remote voice is fanned
# out immediately; only an observed S2S sequence gap waits in its per-speaker
# reorder buffer.
# Ingress lanes, tracked speaker states, and proactive-repair burst capacity
# automatically scale from the live top-level max_users value. They have no
# fixed queue-size settings; lowering max_users blocks only future admission.
[s2s.application.voice]
delivery_strategy = "broadcast" # broadcast, targeted
tree_delivery_enabled = true
transport_ttl_ms = 750
repair_enabled = true
repair_transport_ttl_ms = 750
# Transport TTL for the NACK itself. Its payload separately carries the
# requester's remaining actionable gap time as a relative response deadline;
# that duration is not a synchronized or guaranteed receiver-arrival deadline.
repair_request_ttl_ms = 750
repair_cache_ms = 1600
# Only an observed S2S sequence gap is held. The delay adapts per speaker
# within this narrow range; ordinary contiguous frames are never paced.
reorder_max_delay_ms = 40
reorder_disabled = false
adaptive_jitter_enabled = true
adaptive_jitter_min_delay_ms = 40
adaptive_jitter_max_delay_ms = 120
adaptive_jitter_growth_step_ms = 20
adaptive_jitter_decay_step_ms = 10
reorder_idle_reset_ms = 2000
reorder_max_buffered_frames = 48
reorder_max_total_buffer = 4096
# Proactive alternate-copy demand starts at these loss/jitter thresholds and
# reaches the configured copy budget at repair_full_dup_loss_ppm.
repair_loss_start_ppm = 10000
repair_full_dup_loss_ppm = 30000
repair_jitter_start_ms = 40
# Proactive copies are limited to 0 through 2 per frame (default: 1). This caps
# demand; conserved-credit overflow is ranked by marginal on-time utility and
# destination fairness.
# repair_max_extra_copies_per_frame = 1
# Reactive/tail repair owns 30% of the single 25% repair mint. Proactive work
# may borrow unused reactive credit above the hard 10% reserve. NACK and tail
# frames share deadline-aware, destination-byte-fair permit scheduling. Both
# percentages are measured against the dynamic repair-credit cap; hard reserve
# must not exceed the reactive reserve.
repair_reactive_reserve_pct = 30
repair_reactive_hard_reserve_pct = 10

# ── L2 overlay tunables ───────────────────────────────────────────────
[s2s.overlay]
# Direct-neighbor liveness probe cadence. Increase hello_dead_interval_ms
# when recoverable scheduler/network pauses cause direct-link churn.
hello_interval_ms = 1000
hello_dead_interval_ms = 4000
# Maximum age of an LSA before it expires.
lsa_max_age_ms = 120000
# Max LSAs per `LsdbSyncResp` frame. Larger = fewer round trips on a
# big diff but bigger response packets.
lsdb_sync_max_response_lsas = 2048
# Milliseconds to coalesce LSA floods before sending.
lsa_flood_pacing_interval_ms = 1000
# Max LSAs per paced `LsaFlood` frame.
lsa_flood_max_batch_lsas = 4096
# Suppress unchanged periodic refresh LSAs until the unchanged interval.
lsa_refresh_reduction_enabled = true
lsa_unchanged_refresh_interval_secs = 90
# Maintain routing tables incrementally after startup.
routing_dynamic_spf_enabled = true
# Minimum interval and loss-change threshold for cost-only SPF reruns.
cost_rerun_min_interval_ms = 5000
cost_rerun_loss_ppm = 100000
# Whether this node may be used as a transit router for other nodes' S2S
# overlay data. Local delivery and locally originated messages still work.
route_transit_messages = true
# Ordered overlay-lane windows, retry timing, and repair cache bounds.
ordered_lane_cap = 64
ordered_pending_window_packets = 1024
ordered_reorder_buffer_packets = 1024
ordered_repair_cache_packets = 1024
ordered_ack_timeout_ms = 250
ordered_retry_initial_ms = 250
ordered_retry_max_ms = 2000
ordered_retry_max_age_ms = 30000
ordered_retry_max_attempts = 16

# ── L3 replications tunables ──────────────────────────────────────────
[s2s.replications]
# Strict (Tempo) clock-tick scaling. Used when the LSDB has no measured
# edges yet (cold start, single-node cluster).
fallback_clock_tick_ms = 250
# Floor on the dynamic tick interval. Even on very fast networks we
# don't want to flood the cluster with ticks.
min_clock_tick_ms = 100
# Ceiling on the dynamic tick interval. Even on very slow networks we
# don't want a single silent peer to stall delivery for too long.
max_clock_tick_ms = 5000

# Strict delivery loop / GC.
delivery_tick_interval_ms = 50
strict_consensus_retry_min_ms = 500
strict_consensus_retry_max_ms = 3000
strict_consensus_rtt_margin_ms = 100
strict_consensus_retry_jitter_pct = 25
# Bounds for the per-hop enqueue lifetime. This is not an end-to-end packet
# deadline; consensus retries provide reliability.
strict_transport_ttl_min_ms = 500
strict_transport_ttl_max_ms = 1000
# Per-proposal timeout. After this the propose future fails with
# `ProposeTimeout`.
propose_ttl_ms = 10000
# Cap on concurrent in-flight proposals from this node.
propose_semaphore_size = 32
# Cap on `CatchupOp`s returned per `StrictCatchupResp` chunk.
strict_max_catchup_ops = 256
# Byte bounds for strict catchup chunks and retained resumable snapshots.
strict_max_catchup_bytes = 524288
strict_max_snapshot_transfer_bytes = 67108864
# Minimum spacing between strict startup/heal history-election attempts.
strict_bootstrap_retry_interval_ms = 500
# Base cadence for directed, evidence-driven V4 durable-head retries. They
# continue while the strict repository log is quiet until exact acknowledgement.
strict_steady_state_catchup_interval_ms = 5000
# Per-next-hop strict bulk pacing. Byte budgets are shared by all topics and
# logical destinations whose current route uses the same first hop.
strict_bulk_max_in_flight_bytes_per_next_hop = 262144
strict_bulk_rate_bytes_per_second_per_next_hop = 1048576
strict_bulk_retry_max_delay_ms = 5000
strict_bulk_retry_jitter_pct = 25
# Pending propose entries are GC'd after this period. Must be longer
# than `propose_ttl_ms` so a proposer's caller-visible timeout fires
# before the remote-side state evaporates.
pending_propose_ttl_ms = 20000
# Recovery in-progress state is dropped after this many milliseconds
# without a quorum of acks.
recovery_ttl_ms = 10000

# Owner-mode catchup.
# Suppress duplicate per-origin catchup requests within this window.
owner_catchup_timeout_ms = 5000
# Compatibility setting retained for older configurations. Owner repair is now
# driven by bootstrap, membership changes, and observed version gaps.
owner_anti_entropy_interval_ms = 30000
# Cap on `CatchupOp`s returned per `OwnerCatchupResp` chunk.
owner_max_catchup_ops = 256
catchup_max_in_flight_total = 8
catchup_max_in_flight_per_peer = 1
client_replication_max_in_flight = 32

# Content-addressed channel blob transfer.
# Max bytes per blob chunk carried inside one replication frame.
blob_chunk_size = 65536
# Total time a blob fetch may stay in-flight before the client request misses.
blob_request_timeout_ms = 10000
# Time to wait for seed offers before re-broadcasting the find request.
blob_offer_wait_ms = 250
# Minimum time before retrying unanswered chunk requests.
blob_retry_interval_ms = 500
# Number of seed nodes to request from concurrently for one blob.
blob_max_parallel_peers = 3
# Cadence for scanning unused channel blobs.
blob_decay_interval_ms = 60000
# Time an unreferenced channel blob must remain unused before deletion.
blob_unused_grace_ms = 600000
# Retry delay and per-peer concurrency for bulk replication sends.
bulk_retry_delay_ms = 250
bulk_max_in_flight_per_peer = 1

# Browser gateway. Disabled by default and requires the relevant Cargo feature.
[web]
enabled = false
listen = "0.0.0.0:64739"
public_base_url = "https://localhost:64739"
allowed_origins = ["https://localhost:64739"]

[web.auth]
modes = ["password", "sso"]
password_enabled = true

[web.auth.sso]
issuer = "https://idp.example.com"
jwks_url = "https://idp.example.com/.well-known/jwks.json"
audience = "shitspeak-web"
subject_claim = "sub"
username_claim = "preferred_username"
groups_claim = "groups"

[web.webrtc]
max_speaker_ssrcs = 64
audio_bitrate = 64000
ice_servers = [
  { urls = ["stun:stun.l.google.com:19302"] },
]

[web.moq]
enabled = false
# Separate QUIC/WebTransport listener; WebTransport cannot be served through
# the existing TCP/TLS Mumble ALPN path.
listen = "0.0.0.0:64740"
public_url = "https://localhost:64740/web/moq"
# Defaults to the main server cert_path/key_path when omitted. WebTransport
# clients need a certificate they can validate for this origin.
# cert_path = "cert.pem"
# key_path = "key.pem"
max_speaker_tracks = 64
audio_bitrate = 64000

# Optional Grafana Loki log shipping. `url` may be either the Loki base URL
# or the full `/loki/api/v1/push` endpoint. These settings are read at startup.
[logging.loki]
enabled = false
# url = "http://localhost:3100"
# tenant_id = "tenant"
# username = "grafana-cloud-user-or-org-id"
# password = "grafana-cloud-token"
# bearer_token = "token"
batch_size = 128
flush_interval_ms = 1000
# EnvFilter directive for logs shipped to Loki. By default, only this crate's
# modules are shipped (`shitspeak_rs=debug`); widen this explicitly if you also
# want dependency logs.
filter = "shitspeak_rs=debug"
# Legacy fallback used when `filter` is omitted.
level = "debug"
queue_capacity = 4096
request_timeout_ms = 5000
retry_cache_capacity = 4096
retry_initial_interval_ms = 1000
retry_max_interval_ms = 30000
labels = { environment = "local" }

# Optional Prometheus/Grafana Mimir metrics. When enabled, `/metrics` exposes
# the same topology data used by the S2S debug view. `remote_write` is optional;
# scraping this endpoint with Prometheus or Grafana Alloy is usually preferred.
[observability.metrics]
enabled = false
# listen = "0.0.0.0:64751"
path = "/metrics"

[observability.metrics.remote_write]
enabled = false
# url = "http://localhost:9009/api/v1/push"
# tenant_id = "tenant"
# username = "grafana-cloud-user-or-org-id"
# password = "grafana-cloud-token"
# bearer_token = "token"
labels = { environment = "local" }
interval_ms = 15000
batch_size = 4096
retry_cache_capacity = 16384
request_timeout_ms = 5000
retry_initial_interval_ms = 1000
retry_max_interval_ms = 30000
