# ShitSpeak server configuration for local testing

node_id = 1
listen = "0.0.0.0:64738"
register_name = "ShitSpeak Test"

# ── Public server registration ──────────────────────────────────────────
# Uncomment and fill in to register this server with the public Mumble
# server list.  All three fields are required for registration to activate.
# register_password = "your-registry-password"
# register_url = "https://publist-registration.mumble.info/v1/register"
# register_hostname = "my-server.example.com"
# register_location = "New York, USA"
cert_path = "cert.pem"
key_path = "key.pem"
send_version = true
send_build_info = true
send_os_info = true
allowed_proxies = []
min_client_version = 0
max_users = 100

# Authentication backend. Omit this to use the built-in demo authenticator.
# The configured WASM file is loaded at startup and hot-reloaded when the file
# or config.toml changes.
# authenticator_wasm_path = "auth.wasm"

# Mumble standard
welcome_text = "Welcome to ShitSpeak test server!"
max_bandwidth = 72000
allow_html = true
max_text_message_length = 5000
max_image_message_length = 131072
default_channel = 0
cert_required = false
# When enabled, clients only see users in channels they can Traverse.
hide_users_without_traverse = false

# UDP
udp_voice_enabled = true
udp_ping_enabled = true
# cluster = clusterwide user count and summed cluster max_users; local = this node only
# Per-port virtual-server UDP ping status can be overridden with
# [[server_entrypoints]].udp_ping_status_server_id; otherwise a listen entrypoint reports its server_id.
udp_ping_user_count_scope = "cluster"
udp_channel_size = 2048

# Idle timeout (seconds)
client_idle_timeout_secs = 30
pending_delete_timeout_ms = 5000

# Persistence
blob_storage_dir = "data"
channel_log_max_entries = 10000
client_log_max_entries = 10000
channel_snapshot_every_ops = 10
channel_snapshot_every_secs = 60
channel_wal_compaction_expire_count = 2000

# S2S (server-to-server)
# ── L1 transport tunables ─────────────────────────────────────────────
# Per-link metrics smoothing (EWMA coefficients) and ping-cap.
[s2s.transport]
# Smoothing coefficient for the latency EWMA.
latency_ewma_alpha = 0.2
# Smoothing coefficient for the jitter EWMA (RFC 3550 uses 1/16).
jitter_ewma_alpha = 0.0625
# Smoothing coefficient for the active-probe throughput EWMA.
throughput_ewma_alpha = 0.3
# Smoothing coefficient for the long-term packet loss EWMA.
packet_loss_ewma_alpha = 0.02
# Fast transport keepalive interval used before a link has proven stable.
ping_interval_secs = 2
# Slower keepalive interval used after the first keepalive pong on a link.
idle_ping_interval_secs = 10
# How often stream transports sample native loss counters; zero disables it.
native_stats_interval_secs = 10
# Cap on in-flight pings remembered per stream/UDP session.
max_pending_pings = 64
# Exponential probing retry cap for peers seen recently.
recent_probe_retry_cap_secs = 30
# Exponential probing retry cap for peers not seen for stale_probe_age_secs.
stale_probe_retry_cap_secs = 600
# Age where a peer is considered old enough to use the stale retry cap.
stale_probe_age_secs = 3600
# When another direct path to a peer is already live, failed addresses that
# are neither currently advertised nor on the live remote IP back off in this
# 5-30 minute range and are removed after repeated capped failures.
unconfirmed_address_retry_floor_secs = 300
unconfirmed_address_retry_cap_secs = 1800
unconfirmed_address_decay_failures = 5
# How often to sample one otherwise unselected peer/transport while the
# outgoing cap is full. Set to 0 to disable.
unselected_link_probe_interval_secs = 30
# Soft cap on live outbound S2S transport sessions. Inbound is still accepted.
max_outgoing_connections = 1024
# Selective L1 payload compression. Callers still opt in per send.
compression_enabled = true
compression_min_bytes = 1024
compression_min_savings_percent = 10
compression_level = 1

# ── L2 overlay tunables ───────────────────────────────────────────────
[s2s.overlay]
# Max LSAs per `LsdbSyncResp` frame. Larger = fewer round trips on a
# big diff but bigger response packets.
lsdb_sync_max_response_lsas = 2048
# Milliseconds to coalesce LSA floods before sending.
lsa_flood_pacing_interval_ms = 1000
# Max LSAs per paced `LsaFlood` frame.
lsa_flood_max_batch_lsas = 4096
# Suppress unchanged periodic refresh LSAs until the unchanged interval.
lsa_refresh_reduction_enabled = true
lsa_unchanged_refresh_interval_secs = 90
# Maintain routing tables incrementally after startup.
routing_dynamic_spf_enabled = true
# Whether this node may be used as a transit router for other nodes' S2S
# overlay data. Local delivery and locally originated messages still work.
route_transit_messages = true

# ── L3 replications tunables ──────────────────────────────────────────
[s2s.replications]
# Strict (Tempo) clock-tick scaling. Used when the LSDB has no measured
# edges yet (cold start, single-node cluster).
fallback_clock_tick_ms = 250
# Floor on the dynamic tick interval. Even on very fast networks we
# don't want to flood the cluster with ticks.
min_clock_tick_ms = 100
# Ceiling on the dynamic tick interval. Even on very slow networks we
# don't want a single silent peer to stall delivery for too long.
max_clock_tick_ms = 5000

# Strict delivery loop / GC.
delivery_tick_interval_ms = 50
# Per-proposal timeout. After this the propose future fails with
# `ProposeTimeout`.
propose_ttl_ms = 10000
# Cap on concurrent in-flight proposals from this node.
propose_semaphore_size = 32
# Cap on `CatchupOp`s returned per `StrictCatchupResp` chunk.
strict_max_catchup_ops = 256
# Pending propose entries are GC'd after this period. Must be longer
# than `propose_ttl_ms` so a proposer's caller-visible timeout fires
# before the remote-side state evaporates.
pending_propose_ttl_ms = 20000
# Recovery in-progress state is dropped after this many milliseconds
# without a quorum of acks.
recovery_ttl_ms = 10000

# Owner-mode catchup.
# Suppress duplicate per-origin catchup requests within this window.
owner_catchup_timeout_ms = 5000
# Cap on `CatchupOp`s returned per `OwnerCatchupResp` chunk.
owner_max_catchup_ops = 256

# Content-addressed channel blob transfer.
# Max bytes per blob chunk carried inside one replication frame.
blob_chunk_size = 65536
# Total time a blob fetch may stay in-flight before the client request misses.
blob_request_timeout_ms = 10000
# Time to wait for seed offers before re-broadcasting the find request.
blob_offer_wait_ms = 250
# Minimum time before retrying unanswered chunk requests.
blob_retry_interval_ms = 500
# Number of seed nodes to request from concurrently for one blob.
blob_max_parallel_peers = 3
# Cadence for scanning unused channel blobs.
blob_decay_interval_ms = 60000
# Time an unreferenced channel blob must remain unused before deletion.
blob_unused_grace_ms = 600000

# Browser WebRTC gateway. Disabled until the HTTP/signaling gateway is wired.
[web]
enabled = false
listen = "0.0.0.0:64739"
public_base_url = "https://localhost:64739"
allowed_origins = ["https://localhost:64739"]

[web.auth]
modes = ["password", "sso"]
password_enabled = true

[web.auth.sso]
issuer = "https://idp.example.com"
jwks_url = "https://idp.example.com/.well-known/jwks.json"
audience = "shitspeak-web"
subject_claim = "sub"
username_claim = "preferred_username"
groups_claim = "groups"

[web.webrtc]
max_speaker_ssrcs = 64
audio_bitrate = 64000
ice_servers = [
  { urls = ["stun:stun.l.google.com:19302"] },
]

[web.moq]
enabled = false
# Separate QUIC/WebTransport listener; WebTransport cannot be served through
# the existing TCP/TLS Mumble ALPN path.
listen = "0.0.0.0:64740"
public_url = "https://localhost:64740/web/moq"
# Defaults to the main server cert_path/key_path when omitted. WebTransport
# clients need a certificate they can validate for this origin.
# cert_path = "cert.pem"
# key_path = "key.pem"
max_speaker_tracks = 64
audio_bitrate = 64000
