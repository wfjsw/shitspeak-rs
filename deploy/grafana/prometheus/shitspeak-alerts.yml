groups:
  - name: shitspeak-realtime
    rules:
      - alert: ShitSpeakS2SRoutedQueueHigh
        expr: |
          max by (job, source, peer, transport) (
            shitspeak_s2s_queue_status{direction="outgoing",metric="depth"}
            / ignoring(metric)
            shitspeak_s2s_queue_status{direction="outgoing",metric="capacity"}
          ) > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "S2S routed queue is above 80%"
          description: "Outgoing S2S queue {{ $labels.source }} -> {{ $labels.peer }} over {{ $labels.transport }} has stayed above 80% capacity for 2 minutes."

      - alert: ShitSpeakS2SKcpQueueStuck
        expr: |
          (
            max by (job, source, peer, transport) (
              shitspeak_s2s_queue_status{direction="outgoing",transport="kcp",metric="depth"}
              / ignoring(metric)
              shitspeak_s2s_queue_status{direction="outgoing",transport="kcp",metric="capacity"}
            ) > 0.9
          )
          and on (job, source, peer, transport)
          (
            max by (job, source, peer, transport) (
              shitspeak_s2s_direct_metric_traffic_bps{transport="kcp",direction="wire_sent"}
            ) == 0
          )
          and on (job, source, peer, transport)
          (
            max by (job, source, peer, transport) (
              shitspeak_s2s_direct_metric_traffic_bps{transport="kcp",direction="wire_recv"}
            ) == 0
          )
          and on (job, source, peer, transport)
          (
            max by (job, source, peer, transport) (
              shitspeak_s2s_direct_metric_last_update_age_ms{transport="kcp"}
            ) > 1500
          )
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "KCP queue is stuck with zero wire traffic"
          description: "KCP queue {{ $labels.source }} -> {{ $labels.peer }} is above 90% while wire traffic is zero and transport metrics are stale."

      - alert: ShitSpeakLocalVoiceRouteSlow
        expr: |
          sum by (job) (
            rate(shitspeak_voice_route_duration_us_bucket_total{source="local",bucket="gt_10000"}[2m])
          ) > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Local voice routing is slower than 10 ms"
          description: "Local voice route duration gt_10000 bucket is above 5 frames/sec for 2 minutes."

      - alert: ShitSpeakStaleVoiceDropsHigh
        expr: |
          (
            sum by (job) (rate(shitspeak_voice_stale_drops_total[2m]))
            /
            clamp_min(sum by (job) (rate(shitspeak_voice_ingress_packets_total[2m])), 1)
          ) > 0.01
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Realtime voice stale-drop rate is above 1%"
          description: "Stale voice drops exceeded 1% of decoded voice ingress for 2 minutes."

      - alert: ShitSpeakVoicePathSwitchRateHigh
        expr: |
          (
            1000 * (
              (sum(rate(shitspeak_s2s_voice_transport_binding_events_total{
                from_transport!="none",to_transport!="none",
                reason!~"initial|idle_reset|no_alternate"
              }[2m])) or vector(0))
              +
              (sum(rate(shitspeak_s2s_voice_tree_edge_binding_events_total{
                from_mode!="none",to_mode!="none",
                reason!~"initial|idle_reset|no_alternate"
              }[2m])) or vector(0))
            )
            /
            clamp_min(sum(rate(shitspeak_s2s_debug_packet_io_packets_total{
              direction="sent",packet_kind="application.voice.tree.original"
            }[2m])), 1e-9)
          ) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Voice path switching exceeds 10 per 1,000 originals"
          description: "Transport and tree-edge bindings have switched more than 10 times per 1,000 directed tree-original frames for 2 minutes."

      - alert: ShitSpeakVoicePathNoAlternateHigh
        expr: |
          (
            (sum(rate(shitspeak_s2s_voice_transport_binding_events_total{reason="no_alternate"}[30s])) or vector(0))
            +
            (sum(rate(shitspeak_s2s_voice_tree_edge_binding_events_total{reason="no_alternate"}[30s])) or vector(0))
          ) > 1
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Voice path failover has no alternate"
          description: "Sticky transport or tree-edge failover has reported more than one no-alternate event per second for 30 seconds."

      - alert: ShitSpeakChinaDfwDeadlineFlushHigh
        expr: |
          (
            sum(rate(shitspeak_s2s_voice_receive_events_total{
              source="13",origin_node="12",result="deadline_flush"
            }[1m]))
            /
            clamp_min(sum(rate(shitspeak_s2s_voice_receive_events_total{
              source="13",origin_node="12",result=~"in_order|gap_filled|deadline_flush"
            }[1m])), 1e-9)
          ) > 0.05
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "China to DFW voice deadline-flush share exceeds 5%"
          description: "DFW node 13 has deadline-flushed more than 5% of emitted frames originated by China node 12 for 1 minute."
